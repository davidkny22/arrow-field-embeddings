[metadata]
name = afe
version = 0.1.0
author = David Kogan
description = Arrow Field Embeddings: preserving high-dimensional information in 3D with directional annotations
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Intended Audience :: Science/Research

[options]
package_dir =
    = source
packages = find:
python_requires = >=3.9
install_requires =
    numpy >= 1.22
    scikit-learn >= 1.0
    scipy >= 1.7
    plotly >= 5.0

[options.extras_require]
pacmap =
    pacmap >= 0.7
full =
    pacmap >= 0.7
dev =
    pytest
    matplotlib
    pandas

[options.packages.find]
where = source
